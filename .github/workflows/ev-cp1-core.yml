name: EV-CP1 core checks
on:
  push:
    branches: [main]
    paths:
      - 'Evolution_Source/**'
      - '.github/workflows/ev-cp1-core.yml'
      - 'docs/PROGRESS.md'
      - 'docs/DECISIONS.md'
      - 'docs/UNITY_VALIDATION.md'
      - 'docs/EV_CP2_VALIDATION.md'
      - 'README.md'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
  pull_request:
    paths:
      - 'Evolution_Source/**'
      - '.github/workflows/ev-cp1-core.yml'
      - 'docs/PROGRESS.md'
      - 'docs/DECISIONS.md'
      - 'docs/UNITY_VALIDATION.md'
      - 'docs/EV_CP2_VALIDATION.md'
      - 'README.md'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ev-cp1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    name: Core / ${{ matrix.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Evolution_Source
    strategy:
      fail-fast: false
      matrix:
        revision:
          - a0edc8ce426908742b8901faddf4215418d900f3
          - fb338ee968cd141602ad48a423594a86a638ef20
          - 986c8ee371d008e47d1dcc7ca836358fa6537c43
          - current
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'current' && github.sha || matrix.revision }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select and verify .NET 8 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f global.json ]; then
            printf '%s\n' '{"sdk":{"version":"8.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json
          fi
          dotnet --version | tee "$RUNNER_TEMP/sdk-version.log"
          [[ "$(dotnet --version)" == 8.0.* ]]
      - name: Verify exact checked out revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ matrix.revision == 'current' && github.sha || matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Compile Unity-compatible core API surface
        if: matrix.revision == 'current'
        shell: bash
        run: dotnet build Tests/Compatibility/Evolution.Core.Compatibility.csproj --configuration Release
      - name: Compile and execute actual CSharp core
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tests/Standalone/Evolution.Core.Tests.csproj --configuration Release | tee "$RUNNER_TEMP/core-tests.log"
          echo "::notice title=CSharp assertions::$(grep '^PASS:' "$RUNNER_TEMP/core-tests.log")"
      - name: Execute articulated organism mechanics
        if: matrix.revision == 'current'
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/run_checked.py dotnet run --project Tests/Articulated/Evolution.Articulated.Tests.csproj --configuration Release | tee "$RUNNER_TEMP/articulated-tests.log"
          echo "::notice title=EV-CP2 assertions::$(grep '^PASS:' "$RUNNER_TEMP/articulated-tests.log")"
          echo "::notice title=EV-CP3 assertions::$(grep '^EV-CP3:' "$RUNNER_TEMP/articulated-tests.log")"
      - name: Parse actual adapters and Unity tests with CSharp 9 Roslyn
        if: matrix.revision == 'current'
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/run_checked.py dotnet run --project Tests/AdapterSyntax/Evolution.AdapterSyntax.csproj --configuration Release -- . | tee "$RUNNER_TEMP/adapter-syntax.log"
      - name: Independent Python references and wiring checks
        shell: bash
        run: python3 -m unittest discover -s Tests -p 'verify_*.py' -v
      - name: Preserve compiler and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-output-${{ matrix.revision }}
          path: |
            ${{ runner.temp }}/sdk-version.log
            ${{ runner.temp }}/core-tests.log
            ${{ runner.temp }}/articulated-tests.log
            ${{ runner.temp }}/adapter-syntax.log
          if-no-files-found: ignore
          retention-days: 14
